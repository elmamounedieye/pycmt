[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycmt"
version = "0.1.0"
description = "Python Climate Monitoring Tools"
authors = [
    {name = "Mouhamed El Mamoune Dieye"}
]

dependencies = [
    "affine",
    "Cartopy>=0.22.0",             # Version minimale pour un support Python 3.11 propre
    "cdo",
    "cftime",
    "dask",
    "geopandas>=0.13.0",
    "ipywidgets",
    "widgetsnbextension",
    "Jinja2",
    "matplotlib>=3.7.0",           # Support stable pour 3.11
    "netCDF4",
    "numba>=0.57.0",               # Version minimale obligatoire pour supporter Python 3.11
    "numpy>=1.24.0,<2.0.0",        # IMPORTANT : On bloque à NumPy 1.x pour éviter les crashs de NumPy 2.0
    "openpyxl",
    "pandas>=2.0.0",
    "pyogrio",
    "pyproj",
    "pyshp",
    "PyYAML",
    "rasterio>=1.3.0",
    "requests",
    "rioxarray",
    "scipy",
    "shapely>=2.0.0",
    "uvicorn",
    "xarray",
    "xgrads",
]
#[project.scripts]
#pycmt = "pycmt:climonitor"

[tool.setuptools]
# AUTOMATION : Force la recherche récursive de TOUS tes sous-dossiers (core, modules, visualization)
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
# Sécurité pour inclure le dossier data interne
"pycmt" = ["data/**/*", "data/*"]
