[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycmt"
version = "0.1.0"
description = "Python Climate Monitoring Tools"
authors = [
    {name = "Mouhamed El Mamoune Dieye"}
]

requires-python = ">=3.10,<3.14"

dependencies = [
    "affine",
    "Cartopy>=0.23.0",            
    "cdo",
    "cftime",
    "dask>=2024.1.0",             
    "geopandas>=0.14.0",           
    "ipywidgets",
    "widgetsnbextension",
    "Jinja2",
    "matplotlib>=3.8.0",           
    "netCDF4>=1.6.5",
    "numba>=0.59.0",               
    "numpy>=1.26.0",               
    "openpyxl",
    "pandas>=2.1.0",
    "pyogrio>=0.7.2",             
    "pyproj>=3.6.0",
    "pyshp",
    "PyYAML",
    "rasterio>=1.3.9",
    "requests",
    "rioxarray>=0.15.0",
    "scipy>=1.11.0",
    "shapely>=2.0.2",             
    "uvicorn",
    "xarray>=2023.11.0",
    "xgrads",
]
#[project.scripts]
#pycmt = "pycmt:climonitor"

[tool.setuptools]
# AUTOMATION : Force la recherche récursive de TOUS tes sous-dossiers (core, modules, visualization)
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.setuptools.package-data]
# Sécurité pour inclure le dossier data interne
"pycmt" = ["data/**/*", "data/*"]
